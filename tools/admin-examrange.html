<!DOCTYPE html>
<!-- v1.0 (2026-08-22): 신규 생성 — data/exam-ranges.json을 손으로 편집하던 것을 대체하는 관리자 전용 화면.
     학교별 카드를 추가/수정/삭제하고 저장하면 GitHub에 바로 커밋됨(관리자 직접 등록이라 검토대기 없이 즉시반영).
     review.html/admin-users.html과 동일하게 로그인+admin 게이트, 비공개 경로(noindex) 원칙 적용. -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<script>
  (function(){
    var session = null;
    try { session = JSON.parse(localStorage.getItem('mathapp_session') || 'null'); } catch(e){}
    if(!session || !session.studentId){
      window.location.replace('../worksheets/login.html?redirect=' + encodeURIComponent(window.location.href));
    } else if(session.role !== 'admin'){
      alert('이 페이지는 선생님/관리자만 볼 수 있어요.');
      window.location.replace('../index.html');
    }
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시험범위 공지 관리</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --paper:#f6f4ee; --ink:#20242b; --rule:#d9d3c4; --accent:#1f6f5c;
    --accent-soft:#e3efe9; --wrong:#b23a2e; --wrong-soft:#f7e6e3; --num:#8a8474; --sheet:#fffdf8;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Noto Sans KR', -apple-system, sans-serif; padding-bottom:80px;
  }
  header{ padding:20px 18px 14px; border-bottom:2px solid var(--ink); display:flex; align-items:center; justify-content:space-between; }
  h1{ font-size:18px; margin:0; }
  .refresh-btn{
    width:32px; height:32px; border-radius:50%; border:1.5px solid var(--rule);
    background:#fff; cursor:pointer; font-size:14px;
  }
  main{ padding:16px 18px; max-width:640px; margin:0 auto; }

  .school-card{
    background:var(--sheet); border:1.5px solid var(--rule); border-radius:14px;
    padding:14px 16px; margin-bottom:10px;
  }
  .sc-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .sc-title{ font-size:14.5px; font-weight:800; }
  .sc-sub{ font-size:12px; color:var(--num); margin-top:2px; }
  .sc-actions{ display:flex; gap:6px; flex:0 0 auto; }
  .icon-btn{
    width:30px; height:30px; border-radius:50%; border:1.5px solid var(--rule);
    background:#fff; cursor:pointer; font-size:13px;
  }
  .icon-btn.danger{ border-color:var(--wrong); color:var(--wrong); }

  .add-btn{
    width:100%; font-family:inherit; font-size:14px; font-weight:800;
    padding:13px; border-radius:12px; border:1.5px dashed var(--rule);
    background:#fff; color:var(--num); cursor:pointer; margin-top:6px;
  }

  .empty{ text-align:center; color:var(--num); font-size:13px; padding:40px 0; }

  /* 편집 폼 */
  #editOverlay{
    display:none; position:fixed; inset:0; background:rgba(20,24,30,0.5); z-index:200;
    overflow-y:auto; padding:20px 14px;
  }
  #editOverlay.shown{ display:block; }
  .edit-panel{
    background:var(--sheet); border-radius:16px; padding:18px; max-width:600px; margin:0 auto;
  }
  .edit-title{ font-size:16px; font-weight:800; margin-bottom:14px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--num); margin-bottom:5px; }
  .field select, .field input[type="text"], .field textarea{
    width:100%; font-family:inherit; font-size:14.5px;
    padding:10px 12px; border:1.5px solid var(--rule); border-radius:10px;
    background:#fff; color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:56px; line-height:1.5; }
  .field-row{ display:flex; gap:8px; }
  .field-row .field{ flex:1; }

  .round-card{
    background:#fff; border:1.5px solid var(--rule); border-radius:12px;
    padding:12px; margin-bottom:10px;
  }
  .round-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .round-num{ font-size:12.5px; font-weight:800; color:var(--num); }
  .rm-round{ background:none; border:none; color:var(--wrong); font-size:16px; cursor:pointer; padding:2px 6px; }

  .add-round-btn{
    width:100%; font-size:13px; font-weight:700; padding:10px;
    border-radius:10px; border:1.5px dashed var(--rule); background:#fff; color:var(--num);
    cursor:pointer; margin-bottom:14px;
  }

  .edit-actions{ display:flex; gap:10px; margin-top:16px; }
  .btn{ flex:1; font-family:inherit; font-size:14px; font-weight:800; border:none; border-radius:999px; padding:13px; cursor:pointer; }
  .btn.primary{ background:var(--accent); color:#fff; }
  .btn.ghost{ background:#efece2; color:var(--ink); }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .status-msg{ font-size:12.5px; margin-top:10px; text-align:center; }
  .status-msg.ok{ color:var(--accent); font-weight:700; }
  .status-msg.fail{ color:var(--wrong); font-weight:700; }
  .spinner{
    width:14px; height:14px; border:2.5px solid var(--rule); border-top-color:var(--accent);
    border-radius:50%; display:inline-block; animation:spin 0.7s linear infinite; vertical-align:-2px; margin-right:6px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>📢 시험범위 공지 관리</h1>
  <button class="refresh-btn" onclick="loadSchools()">🔄</button>
</header>

<main>
  <div id="schoolList" class="empty">불러오는 중...</div>
  <button class="add-btn" onclick="openEdit(null)">＋ 새 학교 공지 추가</button>
  <div class="status-msg" id="listStatus"></div>
</main>

<div id="editOverlay">
  <div class="edit-panel">
    <div class="edit-title" id="editTitle">새 공지 추가</div>

    <div class="field-row">
      <div class="field">
        <label>학년</label>
        <select id="fGrade">
          <option value="m0">중3</option>
          <option value="m1" selected>고1</option>
          <option value="m2">고2</option>
        </select>
      </div>
      <div class="field">
        <label>학년도 표시 (예: 2026학년도 1학년)</label>
        <input type="text" id="fGradeLabel" placeholder="2026학년도 1학년">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>학교</label>
        <input type="text" id="fSchool" placeholder="예: 홍천고등학교">
      </div>
      <div class="field">
        <label>과목</label>
        <input type="text" id="fSubject" placeholder="예: 수학">
      </div>
    </div>

    <div id="roundsContainer"></div>
    <button class="add-round-btn" onclick="addRound()">＋ 시험 회차 추가</button>

    <div class="field">
      <label>전체 요약(선택)</label>
      <textarea id="fSummary" placeholder="예: 중간·기말 모두 서술형 비중 30%"></textarea>
    </div>

    <div class="edit-actions">
      <button class="btn ghost" onclick="closeEdit()">취소</button>
      <button class="btn primary" id="saveBtn" onclick="saveSchool()">저장</button>
    </div>
    <div class="status-msg" id="editStatus"></div>
  </div>
</div>

<script>
  const SHEET_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbzqgkELv7cxD3UZlVj1XfvNiFtR4o6nI5uyDOLiMme6hx5eCcaVkNc_cUZ3JawAafKc/exec';

  let mySession = null;
  try { mySession = JSON.parse(localStorage.getItem('mathapp_session') || 'null'); } catch(e){}

  let schools = [];
  let editingIndex = null; // null이면 신규 추가
  let rounds = [];         // 편집 중인 회차 목록

  function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  async function loadSchools(){
    const listEl = document.getElementById('schoolList');
    listEl.className = 'empty';
    listEl.textContent = '불러오는 중...';
    try{
      const res = await fetch(SHEET_WEBHOOK_URL, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'getExamRanges', requesterId: mySession && mySession.studentId })
      });
      const json = await res.json();
      if(json.status !== 'ok') throw new Error(json.message || '불러오지 못했어요');
      schools = json.schools || [];
      renderSchoolList();
    } catch(err){
      listEl.className = 'empty';
      listEl.textContent = '불러오기 실패: ' + err.message;
    }
  }

  function renderSchoolList(){
    const listEl = document.getElementById('schoolList');
    if(schools.length === 0){
      listEl.className = 'empty';
      listEl.textContent = '등록된 시험범위 공지가 없어요';
      return;
    }
    listEl.className = '';
    listEl.innerHTML = schools.map((s, i) => `
      <div class="school-card">
        <div class="sc-head">
          <div>
            <div class="sc-title">${escapeHtml(s.school)} · ${escapeHtml(s.subject||'')}</div>
            <div class="sc-sub">${escapeHtml(s.gradeLabel||'')} · 회차 ${((s.rounds)||[]).length}개</div>
          </div>
          <div class="sc-actions">
            <button class="icon-btn" onclick="openEdit(${i})" title="수정">✏️</button>
            <button class="icon-btn danger" onclick="deleteSchool(${i})" title="삭제">🗑</button>
          </div>
        </div>
      </div>`).join('');
  }

  // ===== 편집 오버레이 =====
  function openEdit(index){
    editingIndex = index;
    const overlay = document.getElementById('editOverlay');
    document.getElementById('editStatus').textContent = '';

    if(index === null){
      document.getElementById('editTitle').textContent = '새 공지 추가';
      document.getElementById('fGrade').value = 'm1';
      document.getElementById('fGradeLabel').value = '';
      document.getElementById('fSchool').value = '';
      document.getElementById('fSubject').value = '';
      document.getElementById('fSummary').value = '';
      rounds = [];
    } else {
      const s = schools[index];
      document.getElementById('editTitle').textContent = '공지 수정';
      document.getElementById('fGrade').value = s.grade || 'm1';
      document.getElementById('fGradeLabel').value = s.gradeLabel || '';
      document.getElementById('fSchool').value = s.school || '';
      document.getElementById('fSubject').value = s.subject || '';
      document.getElementById('fSummary').value = s.summary || '';
      rounds = (s.rounds || []).map(r => ({
        title: r.title || '', range: r.range || '',
        units: (r.units || []).join('\n'), note: r.note || ''
      }));
    }
    if(rounds.length === 0) rounds.push({ title:'', range:'', units:'', note:'' });
    renderRounds();
    overlay.classList.add('shown');
  }

  function closeEdit(){
    document.getElementById('editOverlay').classList.remove('shown');
    editingIndex = null;
  }

  function renderRounds(){
    const el = document.getElementById('roundsContainer');
    el.innerHTML = rounds.map((r, i) => `
      <div class="round-card">
        <div class="round-head">
          <span class="round-num">회차 ${i+1}</span>
          ${rounds.length > 1 ? `<button class="rm-round" onclick="removeRound(${i})">🗑</button>` : ''}
        </div>
        <div class="field">
          <label>시험 이름 (예: 2학기 중간고사)</label>
          <input type="text" value="${escapeHtml(r.title)}" oninput="rounds[${i}].title=this.value">
        </div>
        <div class="field">
          <label>범위 (예: p.100~150)</label>
          <input type="text" value="${escapeHtml(r.range)}" oninput="rounds[${i}].range=this.value">
        </div>
        <div class="field">
          <label>단원 목록 (줄바꿈으로 여러 개)</label>
          <textarea oninput="rounds[${i}].units=this.value">${escapeHtml(r.units)}</textarea>
        </div>
        <div class="field">
          <label>비고(선택)</label>
          <input type="text" value="${escapeHtml(r.note)}" oninput="rounds[${i}].note=this.value">
        </div>
      </div>`).join('');
  }

  function addRound(){
    rounds.push({ title:'', range:'', units:'', note:'' });
    renderRounds();
  }
  function removeRound(i){
    rounds.splice(i, 1);
    renderRounds();
  }

  async function saveSchool(){
    const school = document.getElementById('fSchool').value.trim();
    if(!school){ alert('학교 이름을 입력해주세요.'); return; }

    const newEntry = {
      grade: document.getElementById('fGrade').value,
      gradeLabel: document.getElementById('fGradeLabel').value.trim(),
      school: school,
      subject: document.getElementById('fSubject').value.trim(),
      summary: document.getElementById('fSummary').value.trim(),
      rounds: rounds
        .filter(r => r.title.trim())
        .map(r => ({
          title: r.title.trim(),
          range: r.range.trim(),
          units: r.units.split('\n').map(u => u.trim()).filter(Boolean),
          note: r.note.trim()
        }))
    };

    const nextSchools = schools.slice();
    if(editingIndex === null) nextSchools.push(newEntry);
    else nextSchools[editingIndex] = newEntry;

    await persistSchools(nextSchools, '저장');
  }

  async function deleteSchool(index){
    if(!confirm(`"${schools[index].school}" 공지를 삭제할까요?`)) return;
    const nextSchools = schools.slice();
    nextSchools.splice(index, 1);
    await persistSchools(nextSchools, '삭제', document.getElementById('listStatus'));
  }

  async function persistSchools(nextSchools, label, statusElOverride){
    const statusEl = statusElOverride || document.getElementById('editStatus');
    const saveBtn = document.getElementById('saveBtn');
    if(saveBtn) saveBtn.disabled = true;
    statusEl.className = 'status-msg';
    statusEl.innerHTML = `<span class="spinner"></span>${label} 중...`;

    try{
      const res = await fetch(SHEET_WEBHOOK_URL, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'saveExamRanges', requesterId: mySession && mySession.studentId, schools: nextSchools })
      });
      const json = await res.json();
      if(json.status !== 'ok') throw new Error(json.message || (label+'에 실패했어요'));
      schools = nextSchools;
      renderSchoolList();
      statusEl.className = 'status-msg ok';
      statusEl.textContent = `✓ ${label} 완료`;
      if(!statusElOverride) setTimeout(closeEdit, 600);
    } catch(err){
      statusEl.className = 'status-msg fail';
      statusEl.textContent = '✕ ' + err.message;
    } finally {
      if(saveBtn) saveBtn.disabled = false;
    }
  }

  loadSchools();
</script>
</body>
</html>
