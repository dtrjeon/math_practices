<!DOCTYPE html>
<!-- v1.2 (2026-08-12): 문제지용 manifest.json → data/worksheets-manifest.json으로 파일명 변경 (PWA용 root manifest.json과 혼동 방지) -->
<!-- v1.3 (2026-08-18): 새 파일명 규칙(tb/peq/me + grade 필드) 반영 — CATEGORY_LABEL을 tb/peq/me로 교체, 학년 판별을 category 기반에서 grade 필드 기반(isMiddleGrade)으로 변경, 중간·기말 정규식을 mid1/mid2/final1/final2 → _mid_/_final_로 변경, 오래된(재배포 이전) SHEET_WEBHOOK_URL을 최신 URL로 교체 -->
<!-- v1.4 (2026-08-21): 앱 전체 로그인 게이트 통일(index.html/player.html/upload.html과 동일) — mathapp_session이
     없으면 즉시 login.html로 리다이렉트. 또한 problemId 조합에 setId+'-'+p.num(하이픈 구분자)를 쓰고 있었는데,
     이번에 등록된 통계 문제지들의 num 값 자체가 "1-1-1", "V-16"처럼 하이픈을 포함하고 있어서
     startCustomSet()에서 key를 도로 분리할 때 lastIndexOf('-')가 엉뚱한 위치에서 잘라 setId/num이 깨지고
     "선택한 문제로 풀이 시작" 클릭 시 그대로 오류가 나던 버그 수정 — 구분자를 '::'로 교체 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<script>
  (function(){
    var session = null;
    try { session = JSON.parse(localStorage.getItem('mathapp_session') || 'null'); } catch(e){}
    if(!session || !session.studentId){
      window.location.replace('login.html?redirect=' + encodeURIComponent(window.location.href));
    }
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문제 재구성 — 맞춤 세트 만들기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{
    --paper:#f6f4ee;
    --ink:#20242b;
    --rule:#d9d3c4;
    --accent:#1f6f5c;
    --accent-soft:#e3efe9;
    --wrong:#b23a2e;
    --wrong-soft:#f7e6e3;
    --num:#8a8474;
    --sheet:#fffdf8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:100px;
  }
  header{
    max-width:900px;
    margin:0 auto;
    padding:32px 20px 16px;
    border-bottom:2px solid var(--ink);
  }
  h1{ font-size:24px; margin:0 0 6px; font-weight:800; }
  .sub{ font-size:13px; color:var(--num); }

  main{
    max-width:900px;
    margin:0 auto;
    padding:20px;
  }

  .filter-card{
    background:var(--sheet);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:18px;
  }
  .filter-row{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:12px;
  }
  .filter-row:last-child{ margin-bottom:0; }
  .filter-label{
    font-size:12px;
    font-weight:800;
    color:var(--num);
    text-transform:uppercase;
    letter-spacing:0.04em;
    min-width:70px;
  }
  .chip{
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    padding:7px 14px;
    border-radius:999px;
    border:1.5px solid var(--rule);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
  }
  .chip.active{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .chip.wrong-chip.active{ background:var(--wrong); border-color:var(--wrong); }
  .chip.diff-chip.active{ background:var(--accent); border-color:var(--accent); }
  .chip.exam-chip.active{ background:#33578c; border-color:#33578c; }

  .level-switch{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .level-btn{
    font-family:inherit;
    font-size:14px;
    font-weight:800;
    padding:9px 18px;
    border-radius:10px;
    border:1.5px solid var(--rule);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
  }
  .level-btn.active{ background:var(--ink); border-color:var(--ink); color:#fff; }

  .status-line{
    font-size:13px;
    color:var(--num);
    margin-top:10px;
  }

  .set-group{
    margin-bottom:22px;
  }
  .set-group-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .set-group-title{
    font-size:15px;
    font-weight:800;
  }
  .set-group-title .cat{
    font-size:11px;
    font-weight:700;
    color:var(--accent);
    background:var(--accent-soft);
    padding:2px 8px;
    border-radius:5px;
    margin-right:6px;
  }
  .set-select-all{
    font-family:inherit;
    font-size:12px;
    font-weight:700;
    color:var(--accent);
    background:none;
    border:none;
    cursor:pointer;
    text-decoration:underline;
  }

  .problem-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));
    gap:8px;
  }
  .problem-chip{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 12px;
    border-radius:8px;
    border:1.5px solid var(--rule);
    background:#fff;
    cursor:pointer;
    font-size:13px;
  }
  .problem-chip.selected{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .problem-chip.was-wrong{
    border-color:var(--wrong);
  }
  .problem-chip input{ pointer-events:none; }
  .problem-chip .pnum{ font-weight:800; min-width:22px; }
  .problem-chip .diff-tag{
    font-size:10px;
    font-weight:700;
    padding:1px 6px;
    border-radius:4px;
    margin-left:auto;
  }
  .diff-low{background:#e3efe9;color:#1f6f5c;}
  .diff-mid{background:#e8eef7;color:#33578c;}
  .diff-midhigh{background:#f2ecd8;color:#8a6d1f;}
  .diff-high{background:#f7e0d3;color:#a15c1f;}
  .diff-top{background:#f7e0e0;color:#b23a2e;}
  .wrong-mark{ color:var(--wrong); font-size:11px; font-weight:800; }

  .bottom-bar{
    position:fixed;
    bottom:0; left:0; right:0;
    background:#fff;
    border-top:2px solid var(--ink);
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    z-index:100;
  }
  .bottom-bar .count{
    font-size:14px;
    font-weight:800;
  }
  .bottom-bar .count b{ color:var(--accent); }
  .bottom-bar-actions{ display:flex; gap:8px; }
  .btn{
    font-family:inherit;
    font-size:13.5px;
    font-weight:700;
    padding:10px 20px;
    border-radius:999px;
    border:none;
    cursor:pointer;
  }
  .btn-primary{ background:var(--ink); color:#fff; }
  .btn-primary:disabled{ background:#d9d3c4; color:#8a8474; cursor:not-allowed; }
  .btn-secondary{ background:#eee6d6; color:var(--ink); }

  .home-btn{
    position:fixed;
    top:18px;
    right:18px;
    z-index:150;
    width:42px;
    height:42px;
    border-radius:50%;
    background:#20242b;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:18px;
    box-shadow:0 3px 10px rgba(32,36,43,0.3);
    border:none;
  }
</style>
</head>
<body>

<a class="home-btn" href="../index.html" title="홈으로">🏠</a>
<div id="sessionBadge" style="position:fixed; bottom:20px; right:74px; z-index:150; font-size:11.5px; background:#fff; border:1.5px solid var(--rule); border-radius:999px; padding:6px 12px; color:var(--num); box-shadow:0 3px 10px rgba(32,36,43,0.12);"></div>
<script>
  (function(){
    let session = null;
    try { session = JSON.parse(localStorage.getItem('mathapp_session') || 'null'); } catch(e){}
    const el = document.getElementById('sessionBadge');
    if(session && session.studentId && el){
      el.innerHTML = `${session.name}님 · <a href="#" onclick="localStorage.removeItem('mathapp_session'); window.location.href='login.html'; return false;" style="color:var(--accent);">로그아웃</a>`;
    }
  })();
</script>

<header>
  <h1>🧩 문제 재구성</h1>
  <div class="sub">틀린 문제 · 난이도를 기준으로 골라서 나만의 맞춤 세트를 만들어요</div>
</header>

<main>

  <div class="level-switch" id="levelSwitch">
    <button class="level-btn active" id="levelBtn-highschool" onclick="switchLevel('highschool')">고등학교</button>
    <button class="level-btn" id="levelBtn-middleschool" onclick="switchLevel('middleschool')">중학교 3-2</button>
  </div>

  <div class="filter-card">
    <div class="filter-row">
      <span class="filter-label">빠른 필터</span>
      <button class="chip wrong-chip" id="filterWrong" onclick="toggleQuickFilter('wrong')">❌ 틀렸던 문제만</button>
      <button class="chip" id="filterAll" onclick="toggleQuickFilter('all')">전체 보기</button>
    </div>
    <div class="filter-row" id="examFilterRow">
      <span class="filter-label">시험 구분</span>
      <button class="chip exam-chip active" data-exam="all" onclick="toggleExamFilter('all')">전체</button>
      <button class="chip exam-chip" data-exam="mid" onclick="toggleExamFilter('mid')">📗 중간고사</button>
      <button class="chip exam-chip" data-exam="final" onclick="toggleExamFilter('final')">📕 기말고사</button>
    </div>
    <div class="filter-row">
      <span class="filter-label">난이도</span>
      <button class="chip diff-chip" data-diff="low" onclick="toggleDiffFilter('low')">하</button>
      <button class="chip diff-chip" data-diff="mid" onclick="toggleDiffFilter('mid')">중</button>
      <button class="chip diff-chip" data-diff="midhigh" onclick="toggleDiffFilter('midhigh')">중상</button>
      <button class="chip diff-chip" data-diff="high" onclick="toggleDiffFilter('high')">상</button>
      <button class="chip diff-chip" data-diff="top" onclick="toggleDiffFilter('top')">최상</button>
    </div>
    <div class="status-line" id="loadStatus">문제은행과 채점 기록을 불러오는 중...</div>
  </div>

  <div id="setGroups"></div>

</main>

<div class="bottom-bar">
  <div class="count">선택한 문제 <b id="selectedCount">0</b>개</div>
  <label style="font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:6px; cursor:pointer;">
    <input type="checkbox" id="variantToggle" style="width:16px;height:16px;">
    🎲 가능한 문제는 유사문제(다른 숫자)로 시작
  </label>
  <div class="bottom-bar-actions">
    <button class="btn btn-secondary" onclick="clearSelection()">선택 초기화</button>
    <button class="btn btn-primary" id="startBtn" onclick="startCustomSet()" disabled>선택한 문제로 풀이 시작</button>
  </div>
</div>

<script>
  const SHEET_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbzqgkELv7cxD3UZlVj1XfvNiFtR4o6nI5uyDOLiMme6hx5eCcaVkNc_cUZ3JawAafKc/exec';
  const DIFF_LABEL = { low:'하', mid:'중', midhigh:'중상', high:'상', top:'최상' };
  const CATEGORY_LABEL = { tb:'교과문제', peq:'기출·내신', me:'모의고사' };

  // index_mathc1.html과 동일한 규칙: grade가 'm0'면 중학교 3-2, 나머지(m1/m2)는 고등학교
  // (분류(tb/peq/me)는 이제 학년과 무관하게 양쪽 다 쓰이므로, 학년 판별은 category가 아니라
  //  manifest 각 세트의 grade 필드로 한다)
  const isMiddleGrade = grade => grade === 'm0';

  // 세트 id에 _mid_/_final_이 들어있으면 중간·기말로 분류 (index_mathc1.html 범위요약과 동일 규칙)
  function getExamBucket(id){
    if(/_final_/.test(id)) return 'final';
    if(/_mid_/.test(id)) return 'mid';
    return 'other';
  }

  let manifest = null;
  let setsData = {};       // setId -> full set JSON (title, unit, problems[])
  let wrongMap = {};       // "setId-num" -> true  (과거에 틀렸던 적 있는 문제)
  let selection = new Set(); // "setId-num"
  let quickFilter = 'all'; // 'all' | 'wrong'
  let activeDiffs = new Set(); // 비어있으면 전체 난이도
  let currentLevel = 'highschool'; // 'highschool' | 'middleschool'
  let examFilter = 'all'; // 'all' | 'mid' | 'final'

  // 문제지 JSON은 두 가지 스키마가 섞여 있을 수 있다.
  //  A) 정식 스키마: num / diff(low·mid·midhigh·high·top) / type(mc·fillin) / correct(0-based) / solution(배열)
  //  B) 구 스키마(변환 문제지들): number / difficulty(하·중·중상·상·최상) / type(mcq·short) / answer / explanation(문장)
  // normalizeProblem은 B를 A로 변환해 필터링·렌더링 코드가 항상 A만 다루도록 한다. (player.html과 동일 로직)
  const LEGACY_DIFF_MAP = { '하':'low', '중':'mid', '중상':'midhigh', '상':'high', '최상':'top' };

  function normalizeProblem(p){
    const num = (p.num !== undefined) ? p.num : p.number;
    const diff = (p.diff !== undefined) ? p.diff : (LEGACY_DIFF_MAP[p.difficulty] || p.difficulty);
    let type = p.type;
    if(type === 'mcq') type = 'mc';
    else if(type === 'short') type = 'fillin';
    const choices = (p.choices || []).map(c => String(c).replace(/^[①②③④⑤]\s*/, ''));
    let correct = p.correct;
    if(correct === undefined && type === 'mc' && typeof p.answer === 'number'){
      correct = p.answer - 1;
    }
    let solution = p.solution;
    if(!solution && p.explanation){
      solution = [p.explanation];
    }
    return Object.assign({}, p, { num, diff, type, choices, correct, solution });
  }

  function normalizeSet(data){
    data.problems = (data.problems || []).map(normalizeProblem);
    return data;
  }

  async function loadEverything(){
    const statusEl = document.getElementById('loadStatus');
    try{
      const manifestRes = await fetch('../data/worksheets-manifest.json');
      if(!manifestRes.ok) throw new Error(`worksheets-manifest.json 요청 실패 (status ${manifestRes.status})`);
      manifest = await manifestRes.json();

      const failed = [];
      await Promise.all(manifest.sets.map(async s => {
        try{
          const res = await fetch('../data/' + s.file);
          if(!res.ok) throw new Error(`status ${res.status}`);
          setsData[s.id] = normalizeSet(await res.json());
        } catch(e){
          failed.push(s.file + ' (' + e.message + ')');
        }
      }));
      if(failed.length > 0){
        throw new Error('다음 파일을 못 불러왔어요: ' + failed.join(', '));
      }

      try{
        const histRes = await fetch(SHEET_WEBHOOK_URL + '?action=list');
        const records = await histRes.json();
        (records || []).forEach(r => {
          const wsId = String(r.worksheetId || '').replace(/-student$|-review$/, '');
          (String(r.wrongNums || '').split(',')).forEach(numStr => {
            const num = parseInt(numStr.trim(), 10);
            if(!isNaN(num)) wrongMap[wsId + '::' + num] = true;
          });
        });
      } catch(e){
        // 시트 연결이 안 되어도 재구성 화면 자체는 동작하게 둠
      }

      statusEl.textContent = `문제은행 ${manifest.sets.length}개 세트 · 총 ${Object.values(setsData).reduce((a,s)=>a+s.problems.length,0)}문제 불러옴`;
      renderGroups();
      renderMathInElement(document.body, {
        delimiters: [
          {left: "\\(", right: "\\)", display: false},
          {left: "\\[", right: "\\]", display: true}
        ]
      });
    } catch(err){
      statusEl.textContent = '불러오기에 실패했어요: ' + err.message;
    }
  }

  function switchLevel(level){
    currentLevel = level;
    document.getElementById('levelBtn-highschool').classList.toggle('active', level === 'highschool');
    document.getElementById('levelBtn-middleschool').classList.toggle('active', level === 'middleschool');
    // 쎈수학(중학교)은 중간/기말 구분이 없는 문제집이라 중학교 선택 시엔 시험구분 필터를 숨기고 '전체'로 초기화
    examFilter = 'all';
    document.querySelectorAll('.exam-chip').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.exam === 'all');
    });
    document.getElementById('examFilterRow').style.display = (level === 'middleschool') ? 'none' : 'flex';
    renderGroups();
  }

  function toggleExamFilter(mode){
    examFilter = mode;
    document.querySelectorAll('.exam-chip').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.exam === mode);
    });
    renderGroups();
  }

  function toggleQuickFilter(mode){
    quickFilter = mode;
    document.getElementById('filterWrong').classList.toggle('active', mode==='wrong');
    document.getElementById('filterAll').classList.toggle('active', mode==='all');
    renderGroups();
  }

  function toggleDiffFilter(diff){
    if(activeDiffs.has(diff)) activeDiffs.delete(diff);
    else activeDiffs.add(diff);
    document.querySelectorAll('.diff-chip').forEach(btn => {
      btn.classList.toggle('active', activeDiffs.has(btn.dataset.diff));
    });
    renderGroups();
  }

  function problemPasses(setId, p){
    const key = setId + '::' + p.num;
    if(quickFilter === 'wrong' && !wrongMap[key]) return false;
    if(activeDiffs.size > 0 && !activeDiffs.has(p.diff)) return false;
    return true;
  }

  function renderGroups(){
    const container = document.getElementById('setGroups');
    let html = '';
    let shownSetCount = 0, shownProblemCount = 0;
    manifest.sets.forEach(s => {
      const belongsToMiddle = isMiddleGrade(s.grade);
      if((currentLevel === 'middleschool') !== belongsToMiddle) return;
      if(examFilter !== 'all' && getExamBucket(s.id) !== examFilter) return;

      const data = setsData[s.id];
      if(!data) return;
      const visible = data.problems.filter(p => problemPasses(s.id, p));
      if(visible.length === 0) return;
      shownSetCount++; shownProblemCount += visible.length;

      html += `<div class="set-group">
        <div class="set-group-head">
          <div class="set-group-title"><span class="cat">${CATEGORY_LABEL[s.category]||s.category}</span>${s.title}</div>
          <button class="set-select-all" onclick="selectAllInSet('${s.id}')">이 세트 전체 선택</button>
        </div>
        <div class="problem-grid">`;

      visible.forEach(p => {
        const key = s.id + '::' + p.num;
        const isSel = selection.has(key);
        const wasWrong = !!wrongMap[key];
        html += `<label class="problem-chip${isSel?' selected':''}${wasWrong?' was-wrong':''}" onclick="toggleProblem(event,'${key}')">
          <input type="checkbox" ${isSel?'checked':''}>
          <span class="pnum">${p.num}번</span>
          ${wasWrong ? '<span class="wrong-mark">오답</span>' : ''}
          ${p.family ? '<span title="유사문제 생성 가능">🎲</span>' : ''}
          <span class="diff-tag diff-${p.diff}">${DIFF_LABEL[p.diff]||p.diff}</span>
        </label>`;
      });

      html += `</div></div>`;
    });

    container.innerHTML = html || '<p style="color:var(--num);font-size:14px;">조건에 맞는 문제가 없어요. 필터를 조정해보세요.</p>';

    const levelLabel = currentLevel === 'middleschool' ? '중학교 3-2' : '고등학교';
    document.getElementById('loadStatus').textContent =
      `${levelLabel} · 문제은행 ${shownSetCount}개 세트 · 총 ${shownProblemCount}문제 표시 중`;
  }

  function toggleProblem(evt, key){
    evt.preventDefault();
    if(selection.has(key)) selection.delete(key);
    else selection.add(key);
    renderGroups();
    updateBottomBar();
    renderMathInElement(document.getElementById('setGroups'), {
      delimiters: [
        {left: "\\(", right: "\\)", display: false},
        {left: "\\[", right: "\\]", display: true}
      ]
    });
  }

  function selectAllInSet(setId){
    const data = setsData[setId];
    data.problems.filter(p => problemPasses(setId, p)).forEach(p => {
      selection.add(setId + '::' + p.num);
    });
    renderGroups();
    updateBottomBar();
  }

  function clearSelection(){
    selection.clear();
    renderGroups();
    updateBottomBar();
  }

  function updateBottomBar(){
    document.getElementById('selectedCount').textContent = selection.size;
    document.getElementById('startBtn').disabled = selection.size === 0;
  }

  function startCustomSet(){
    const wantVariant = document.getElementById('variantToggle').checked;
    const problems = [];
    selection.forEach(key => {
      const idx = key.indexOf('::');
      const setId = key.slice(0, idx);
      const numStr = key.slice(idx + 2);
      const data = setsData[setId];
      if(!data) return;
      // num은 원래 문자열("1-1-1" 등)일 수도, 숫자일 수도 있어 둘 다 매칭해본다.
      const p = data.problems.find(pp => String(pp.num) === numStr);
      if(p){
        const useVariant = wantVariant && !!p.family;
        problems.push(Object.assign({}, p, { num: problems.length + 1, sourceSet: setId, sourceNum: p.num, useVariant }));
      }
    });
    if(problems.length === 0) return;

    const customSet = {
      id: 'custom-' + Date.now(),
      title: '맞춤 세트 (' + problems.length + '문제)',
      unit: '재구성 화면에서 직접 선택' + (wantVariant ? ' · 일부 유사문제 포함' : ''),
      problems
    };
    sessionStorage.setItem('customProblemSet', JSON.stringify(customSet));
    window.location.href = 'player.html';
  }

  loadEverything();
</script>
</body>
</html>
