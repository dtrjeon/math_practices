<!DOCTYPE html>
<!-- v1.0 (2026-08-21): 신규 생성 — 이름/학교/학년/전화번호로 가입, 비밀번호는 전화번호 뒤 4자리 자동 생성.
     로그인 성공 시 localStorage(mathapp_session)에 세션 저장 후 ?redirect= 파라미터가 있으면 그 페이지로 이동. -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>로그인</title>
<style>
  :root{
    --paper:#f6f4ee;
    --ink:#20242b;
    --rule:#d9d3c4;
    --accent:#1f6f5c;
    --accent-soft:#e3efe9;
    --wrong:#b23a2e;
    --num:#8a8474;
    --sheet:#fffdf8;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', -apple-system, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .card{
    width:100%;
    max-width:380px;
    background:var(--sheet);
    border:1px solid var(--rule);
    border-radius:18px;
    padding:26px 22px;
    box-shadow:0 4px 16px rgba(32,36,43,0.06);
  }
  .brand{ text-align:center; margin-bottom:18px; }
  .brand-icon{ font-size:30px; margin-bottom:6px; }
  .brand-title{ font-size:17px; font-weight:800; }
  .brand-sub{ font-size:12px; color:var(--num); margin-top:2px; }

  .tab-switch{ display:flex; gap:6px; margin-bottom:18px; }
  .tab-btn{
    flex:1; font-family:inherit; font-size:13.5px; font-weight:800;
    padding:10px; border-radius:10px; border:1.5px solid var(--rule);
    background:#fff; color:var(--num); cursor:pointer;
  }
  .tab-btn.active{ background:var(--ink); border-color:var(--ink); color:#fff; }

  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--num); margin-bottom:5px; }
  .field select, .field input{
    width:100%; font-family:inherit; font-size:14.5px;
    padding:11px 12px; border:1.5px solid var(--rule); border-radius:10px;
    background:#fff; color:var(--ink);
  }
  .hint{ font-size:11.5px; color:var(--num); margin-top:4px; }

  .btn{
    width:100%; font-family:inherit; font-size:14.5px; font-weight:800;
    border:none; border-radius:999px; padding:13px; cursor:pointer;
    background:var(--accent); color:#fff; margin-top:6px;
  }
  .btn:disabled{ background:#d9d3c4; color:#8a8474; cursor:not-allowed; }

  .status-msg{ font-size:12.5px; margin-top:10px; text-align:center; }
  .status-msg.ok{ color:var(--accent); font-weight:700; }
  .status-msg.fail{ color:var(--wrong); font-weight:700; }
  .status-msg.busy{ color:var(--num); }

  .spinner{
    width:14px; height:14px; border:2.5px solid var(--rule); border-top-color:var(--accent);
    border-radius:50%; display:inline-block; animation:spin 0.7s linear infinite;
    vertical-align:-2px; margin-right:6px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .form-panel{ display:none; }
  .form-panel.active{ display:block; }

  .session-card{ text-align:center; }
  .session-card .name{ font-size:16px; font-weight:800; margin:4px 0 2px; }
  .session-card .school{ font-size:12.5px; color:var(--num); margin-bottom:16px; }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="brand-icon">🔐</div>
    <div class="brand-title">학습 기록판 로그인</div>
    <div class="brand-sub">이름·학교·학년·전화번호로 간단하게 가입해요</div>
  </div>

  <!-- 이미 로그인된 경우 -->
  <div id="sessionView" class="session-card" style="display:none;">
    <div class="name" id="sessionName"></div>
    <div class="school" id="sessionSchool"></div>
    <button class="btn" onclick="goToRedirect()">계속하기</button>
    <button class="btn" style="background:#efece2; color:var(--ink); margin-top:8px;" onclick="toggleChangePassword()">🔑 비밀번호 변경</button>
    <button class="btn" style="background:#efece2; color:var(--ink); margin-top:8px;" onclick="logout()">다른 계정으로 로그인</button>

    <div id="changePasswordForm" style="display:none; text-align:left; margin-top:16px; padding-top:16px; border-top:1px solid var(--rule);">
      <div class="field">
        <label>현재 비밀번호</label>
        <input type="password" id="curPassword" placeholder="현재 비밀번호" inputmode="numeric">
      </div>
      <div class="field">
        <label>새 비밀번호 (숫자 4자리 이상)</label>
        <input type="password" id="newPassword" placeholder="새 비밀번호" inputmode="numeric">
      </div>
      <div class="field">
        <label>새 비밀번호 확인</label>
        <input type="password" id="newPassword2" placeholder="새 비밀번호 확인" inputmode="numeric">
      </div>
      <button class="btn" id="changePasswordBtn" onclick="doChangePassword()">변경하기</button>
      <div class="status-msg" id="changePasswordStatus"></div>
    </div>
  </div>

  <div id="authView">
    <div class="tab-switch">
      <button class="tab-btn active" id="tabBtn-register" onclick="switchTab('register')">회원가입</button>
      <button class="tab-btn" id="tabBtn-login" onclick="switchTab('login')">로그인</button>
    </div>

    <!-- 회원가입 -->
    <div class="form-panel active" id="panel-register">
      <div class="field">
        <label>이름</label>
        <input type="text" id="regName" placeholder="홍길동">
      </div>
      <div class="field">
        <label>학교</label>
        <input type="text" id="regSchool" placeholder="예: 홍천고등학교">
      </div>
      <div class="field">
        <label>학년</label>
        <select id="regGrade">
          <option value="중3">중학교 3학년</option>
          <option value="고1" selected>고등학교 1학년</option>
          <option value="고2">고등학교 2학년</option>
          <option value="고3">고등학교 3학년</option>
        </select>
      </div>
      <div class="field">
        <label>전화번호</label>
        <input type="tel" id="regPhone" placeholder="01012345678" inputmode="numeric">
        <div class="hint">비밀번호는 전화번호 뒷자리 4개로 자동 생성돼요 (예: 5678)</div>
      </div>
      <button class="btn" id="registerBtn" onclick="doRegister()">가입하기</button>
      <div class="status-msg" id="registerStatus"></div>
    </div>

    <!-- 로그인 -->
    <div class="form-panel" id="panel-login">
      <div class="field">
        <label>전화번호</label>
        <input type="tel" id="loginPhone" placeholder="01012345678" inputmode="numeric">
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="loginPassword" placeholder="비밀번호" inputmode="numeric" maxlength="12">
        <div class="hint">처음 가입 시 비밀번호는 전화번호 뒷자리 4개였어요 (변경했다면 바뀐 비밀번호로)</div>
      </div>
      <button class="btn" id="loginBtn" onclick="doLogin()">로그인</button>
      <div class="status-msg" id="loginStatus"></div>
    </div>
  </div>
</div>

<script>
  const SHEET_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbzqgkELv7cxD3UZlVj1XfvNiFtR4o6nI5uyDOLiMme6hx5eCcaVkNc_cUZ3JawAafKc/exec';
  const SESSION_KEY = 'mathapp_session';

  function getRedirectTarget(){
    const params = new URLSearchParams(window.location.search);
    return params.get('redirect') || '../index.html';
  }
  function goToRedirect(){
    window.location.href = getRedirectTarget();
  }

  function switchTab(tab){
    document.getElementById('tabBtn-register').classList.toggle('active', tab==='register');
    document.getElementById('tabBtn-login').classList.toggle('active', tab==='login');
    document.getElementById('panel-register').classList.toggle('active', tab==='register');
    document.getElementById('panel-login').classList.toggle('active', tab==='login');
  }

  function saveSession(session){
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  }
  function loadSession(){
    try{ return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }
    catch(e){ return null; }
  }
  function logout(){
    localStorage.removeItem(SESSION_KEY);
    document.getElementById('sessionView').style.display = 'none';
    document.getElementById('authView').style.display = 'block';
  }

  (function initSessionView(){
    const session = loadSession();
    if(session && session.studentId){
      document.getElementById('sessionName').textContent = session.name + '님';
      document.getElementById('sessionSchool').textContent = session.school + ' · ' + session.grade;
      document.getElementById('sessionView').style.display = 'block';
      document.getElementById('authView').style.display = 'none';
    }
  })();

  function normalizePhoneInput(v){
    return String(v || '').replace(/\D/g, '');
  }

  function toggleChangePassword(){
    const form = document.getElementById('changePasswordForm');
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
  }

  async function doChangePassword(){
    const session = loadSession();
    if(!session || !session.studentId){ alert('로그인 정보가 없어요. 다시 로그인해주세요.'); return; }

    const curPassword = document.getElementById('curPassword').value.trim();
    const newPassword = document.getElementById('newPassword').value.trim();
    const newPassword2 = document.getElementById('newPassword2').value.trim();
    const statusEl = document.getElementById('changePasswordStatus');
    const btn = document.getElementById('changePasswordBtn');

    if(!curPassword || !newPassword){ statusEl.className='status-msg fail'; statusEl.textContent='모든 칸을 입력해주세요.'; return; }
    if(!/^\d{4,}$/.test(newPassword)){ statusEl.className='status-msg fail'; statusEl.textContent='새 비밀번호는 숫자 4자리 이상이어야 해요.'; return; }
    if(newPassword !== newPassword2){ statusEl.className='status-msg fail'; statusEl.textContent='새 비밀번호가 서로 달라요.'; return; }

    btn.disabled = true;
    statusEl.className = 'status-msg busy';
    statusEl.innerHTML = '<span class="spinner"></span>변경하는 중...';

    try{
      const res = await fetch(SHEET_WEBHOOK_URL, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'changePassword', studentId: session.studentId, currentPassword: curPassword, newPassword })
      });
      const json = await res.json();
      if(json.status !== 'ok') throw new Error(json.message || '변경에 실패했어요');
      statusEl.className = 'status-msg ok';
      statusEl.textContent = '✓ 비밀번호가 변경됐어요.';
      document.getElementById('curPassword').value = '';
      document.getElementById('newPassword').value = '';
      document.getElementById('newPassword2').value = '';
    } catch(err){
      statusEl.className = 'status-msg fail';
      statusEl.textContent = '✕ ' + (err.message || '알 수 없는 오류');
    } finally {
      btn.disabled = false;
    }
  }

  async function doRegister(){
    const name = document.getElementById('regName').value.trim();
    const school = document.getElementById('regSchool').value.trim();
    const grade = document.getElementById('regGrade').value;
    const phone = normalizePhoneInput(document.getElementById('regPhone').value);
    const statusEl = document.getElementById('registerStatus');
    const btn = document.getElementById('registerBtn');

    if(!name || !school){ statusEl.className='status-msg fail'; statusEl.textContent='이름과 학교를 입력해주세요.'; return; }
    if(phone.length < 9 || phone.length > 11){ statusEl.className='status-msg fail'; statusEl.textContent='전화번호를 다시 확인해주세요.'; return; }

    btn.disabled = true;
    statusEl.className = 'status-msg busy';
    statusEl.innerHTML = '<span class="spinner"></span>가입하는 중...';

    try{
      const res = await fetch(SHEET_WEBHOOK_URL, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'registerUser', name, school, grade, phone })
      });
      const json = await res.json();
      if(json.status !== 'ok') throw new Error(json.message || '가입에 실패했어요');
      saveSession({ studentId: json.studentId, name: json.name, school: json.school, grade: json.grade });
      statusEl.className = 'status-msg ok';
      statusEl.textContent = '✓ 가입 완료! 비밀번호는 전화번호 뒷자리 4개예요.';
      setTimeout(goToRedirect, 900);
    } catch(err){
      statusEl.className = 'status-msg fail';
      statusEl.textContent = '✕ ' + (err.message || '알 수 없는 오류');
    } finally {
      btn.disabled = false;
    }
  }

  async function doLogin(){
    const phone = normalizePhoneInput(document.getElementById('loginPhone').value);
    const password = document.getElementById('loginPassword').value.trim();
    const statusEl = document.getElementById('loginStatus');
    const btn = document.getElementById('loginBtn');

    if(!phone || !password){ statusEl.className='status-msg fail'; statusEl.textContent='전화번호와 비밀번호를 입력해주세요.'; return; }

    btn.disabled = true;
    statusEl.className = 'status-msg busy';
    statusEl.innerHTML = '<span class="spinner"></span>로그인하는 중...';

    try{
      const res = await fetch(SHEET_WEBHOOK_URL, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'loginUser', phone, password })
      });
      const json = await res.json();
      if(json.status !== 'ok') throw new Error(json.message || '로그인에 실패했어요');
      saveSession({ studentId: json.studentId, name: json.name, school: json.school, grade: json.grade });
      statusEl.className = 'status-msg ok';
      statusEl.textContent = '✓ 로그인 성공!';
      setTimeout(goToRedirect, 500);
    } catch(err){
      statusEl.className = 'status-msg fail';
      statusEl.textContent = '✕ ' + (err.message || '알 수 없는 오류');
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
