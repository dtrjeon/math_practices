<!DOCTYPE html>
<!-- v1.1 (2026-08-06): normalizeProblem() 어댑터 추가(구 스키마 number/difficulty/mcq/short/answer/explanation 자동 변환), 선택지 이중 LaTeX 래핑 버그 수정 -->
<!-- v1.2 (2026-08-16): 문제 세트 로딩을 manifest.json의 file 경로 기반으로 변경 — data/ 바로 밑 평평한 구조뿐 아니라 data/senmath32/처럼 하위 폴더에 있는 세트도 로드 가능(compose.html과 동일한 방식으로 통일). manifest를 못 읽으면 기존 방식(data/<id>.json)으로 자동 폴백 -->
<!-- v1.3 (2026-08-16): 오답 반복 학습 기능 연동 — 문제별 고유키(problemId) 부여, 퀴즈 종료 시 채점 결과를 문제 단위로 백엔드에 일괄 로그(action:'logAttempts') -->
<!-- v1.4 (2026-08-17): 단답형 문제에 "S펜으로 정답만 쓰기" 캔버스 추가 — 손글씨 인식으로 답 입력창을 자동으로 채워줌(자동채점은 안 하고 학생이 "확인"을 직접 눌러야 채점됨, 오인식 방지). 인식 엔진은 OCR_PROVIDER로 전환 가능: 'ocrspace'(현재, 브라우저에서 OCR.space 직접 호출, 키/백엔드 불필요) / 'anthropic'(백엔드 action:'ocrAnswer' 경유, ANTHROPIC_API_KEY 등록 후 전환) -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>휘문고 공통수학1 기말 기출유사 — 학생용</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{
    --paper:#f6f4ee;
    --ink:#20242b;
    --rule:#d9d3c4;
    --accent:#1f6f5c;
    --accent-soft:#e3efe9;
    --wrong:#b23a2e;
    --wrong-soft:#f7e6e3;
    --num:#8a8474;
    --content-max:1000px;
    --sheet:#fffdf8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== 상단 고정 바 (시작/종료/타이머) ===== */
  .quiz-bar{
    position:sticky;
    top:0;
    z-index:100;
    background:var(--paper);
    border-bottom:2px solid var(--ink);
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
  }
  .quiz-btn{
    font-family:inherit;
    font-size:14px;
    font-weight:800;
    border:none;
    border-radius:999px;
    padding:9px 22px;
    cursor:pointer;
  }
  .quiz-btn.start{ background:var(--accent); color:#fff; }
  .quiz-btn.stop{ background:var(--wrong); color:#fff; }
  .quiz-btn:disabled{ background:#d9d3c4; color:#8a8474; cursor:not-allowed; }
  .quiz-btn.scroll-mode{ background:#efece2; color:#20242b; border:1.5px solid #d9d3c4; }
  .quiz-btn.scroll-mode.active{ background:#b23a2e; color:#fff; border-color:#b23a2e; }
  .quiz-timer{
    font-variant-numeric:tabular-nums;
    font-size:19px;
    font-weight:800;
    background:#fff;
    border:1.5px solid var(--rule);
    border-radius:8px;
    padding:6px 16px;
    min-width:84px;
    text-align:center;
  }

  /* ===== 페이지 네비게이션 ===== */
  .page-nav{
    position:sticky;
    top:57px;
    z-index:90;
    background:var(--paper);
    border-bottom:1px solid var(--rule);
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .page-nav-label{
    font-size:12px;
    color:var(--num);
    font-weight:700;
    margin-right:4px;
  }
  .page-nav-btn{
    font-family:inherit;
    font-size:14px;
    font-weight:800;
    width:34px;
    height:34px;
    border-radius:50%;
    border:1.5px solid var(--rule);
    background:#fff;
    color:var(--num);
    cursor:pointer;
  }
  .page-nav-btn.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }

  header{
    max-width:var(--content-max);
    margin:0 auto;
    padding:22px 20px 4px;
  }
  header h1{ font-size:22px; margin:0 0 4px; font-weight:800; }
  header .sub{ font-size:13px; color:var(--num); }

  /* ===== 페이지 (A4 느낌의 시트) ===== */
  .page{
    display:none;
    max-width:var(--content-max);
    margin:18px auto 60px;
    padding:0 20px;
  }
  .page.active{ display:block; }
  .page-title{
    font-size:13px;
    font-weight:800;
    color:var(--num);
    letter-spacing:0.04em;
    margin-bottom:10px;
    text-transform:uppercase;
  }
  .page-grid{
    background:var(--sheet);
    border:1px solid var(--rule);
    border-radius:16px;
    box-shadow:0 2px 10px rgba(32,36,43,0.05);
    padding:22px;
    display:grid;
    grid-template-columns:1fr;
    gap:0;
  }
  @media (min-width:760px){
    .page-grid{
      grid-template-columns:1fr 1fr;
      column-gap:32px;
      padding:32px;
    }
  }

  /* ===== 문제 카드 ===== */
  .pcard{
    padding:22px 0;
    border-bottom:1px solid var(--rule);
  }
  .page-grid > .pcard:nth-last-child(1),
  .page-grid > .pcard:nth-last-child(2){
    border-bottom:none;
  }
  @media (min-width:760px){
    .page-grid > .pcard{
      border-bottom:1px solid var(--rule);
    }
    .page-grid > .pcard:nth-child(5),
    .page-grid > .pcard:nth-child(6){
      border-bottom:none;
    }
  }
  .pcard-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }
  .pnum{
    font-size:20px;
    font-weight:800;
    color:var(--num);
  }
  .diff-badge{
    font-size:10px;
    font-weight:800;
    padding:2px 7px;
    border-radius:5px;
  }
  .diff-low{background:#e3efe9;color:#1f6f5c;}
  .diff-mid{background:#e8eef7;color:#33578c;}
  .diff-midhigh{background:#f2ecd8;color:#8a6d1f;}
  .diff-high{background:#f7e0d3;color:#a15c1f;}
  .diff-top{background:#f7e0e0;color:#b23a2e;}
  .pquestion{
    font-size:15.5px;
    line-height:1.65;
    margin-bottom:10px;
    white-space:pre-line;
  }
  .pimg-wrap{
    margin:0 0 12px;
  }
  .pimg-wrap img{
    display:block;
    max-width:100%;
    max-height:480px;
    width:auto;
    height:auto;
    object-fit:contain;
    border:1px solid var(--rule);
    border-radius:8px;
    background:#fff;
  }
  .ref-box{
    font-size:13.5px;
    background:#f3f0e6;
    border:1px solid var(--rule);
    border-radius:8px;
    padding:9px 12px;
    margin-bottom:10px;
    line-height:1.9;
  }
  .note-caution{
    margin-top:8px;
    font-size:12.5px;
    color:#7a5b17;
    background:#fbf3da;
    border-left:3px solid #c99a2e;
    padding:7px 10px;
    border-radius:0 4px 4px 0;
  }

  /* ===== 필기 캔버스 ===== */
  .write-pad{ margin:10px 0; }
  .write-pad-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
    flex-wrap:wrap;
    gap:6px;
  }
  .wp-label{ font-size:12px; font-weight:700; color:var(--num); }
  .wp-tools{ display:flex; gap:6px; }
  .wp-mode, .wp-clear{
    font-family:inherit;
    font-size:11.5px;
    font-weight:700;
    color:#6b6558;
    background:#efece2;
    border:1.5px solid transparent;
    border-radius:999px;
    padding:4px 11px;
    cursor:pointer;
  }
  .wp-mode.active{ background:#fff; border-color:var(--ink); color:var(--ink); }
  .wp-mode-erase.active{ border-color:var(--wrong); color:var(--wrong); }
  .write-canvas{
    display:block;
    width:100%;
    height:190px;
    background:
      repeating-linear-gradient(to bottom, transparent 0, transparent 27px, var(--rule) 28px);
    background-color:#fff;
    border:1.5px solid var(--rule);
    border-radius:8px;
    touch-action:none;
    cursor:crosshair;
  }
  .ans-canvas{ height:80px; }
  .ocr-btn{ margin-top:8px; }
  .ocr-status{ font-size:12.5px; color:var(--num); margin-top:6px; display:block; }
  @media (min-width:760px){
    .write-canvas{ height:230px; }
  }

  /* ===== 보기 버튼 ===== */
  .choices{
    display:grid;
    grid-template-columns:1fr;
    gap:8px;
    margin:10px 0 4px;
  }
  .choice-btn{
    font-family:inherit;
    font-size:14.5px;
    text-align:left;
    background:#fff;
    border:1.5px solid var(--rule);
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
    color:var(--ink);
  }
  .choice-btn:hover{ border-color:var(--num); }
  .choice-btn.picked-correct{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:700; }
  .choice-btn.picked{ background:#eef0e8; border-color:#8a8474; color:#20242b; font-weight:700; }
  .choice-btn.picked-wrong{ background:var(--wrong-soft); border-color:var(--wrong); color:var(--wrong); font-weight:700; }
  .choice-btn.reveal-correct{ border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  .choice-btn:disabled{ cursor:default; }

  /* ===== 서술형 답 입력 ===== */
  .answer-check{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin:10px 0 4px;
  }
  .ac-label{ font-size:12.5px; font-weight:700; color:var(--num); }
  .ans-input{
    font-family:inherit;
    font-size:15px;
    border:1.5px solid var(--rule);
    border-radius:8px;
    padding:7px 10px;
    width:120px;
    background:#fff;
  }
  .ans-input:focus{ outline:none; border-color:var(--accent); }
  .ans-input.input-ok{ border-color:var(--accent); background:var(--accent-soft); }
  .ans-input.input-no{ border-color:var(--wrong); background:var(--wrong-soft); }
  .ac-btn{
    font-family:inherit;
    font-size:13.5px;
    font-weight:700;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:8px 16px;
    cursor:pointer;
  }
  .ans-feedback{ font-size:13.5px; font-weight:700; }
  .ans-feedback.fb-ok{ color:var(--accent); }
  .ans-feedback.fb-no{ color:var(--wrong); }

  /* ===== 정답/풀이 토글 ===== */
  .solution-wrap{ margin-top:10px; }
  .solution-toggle{
    font-family:inherit;
    font-size:12.5px;
    font-weight:700;
    color:var(--accent);
    background:var(--accent-soft);
    border:none;
    border-radius:999px;
    padding:6px 14px;
    cursor:pointer;
  }
  .solution-body{
    position:relative;
    margin-top:8px;
    padding:12px 14px;
    background:#fff;
    border:1px solid var(--rule);
    border-radius:8px;
    font-size:14px;
    line-height:1.7;
    white-space:pre-line;
  }
  .solution-body.hidden-sol{
    color:transparent;
    text-shadow:0 0 9px rgba(32,36,43,0.55);
    user-select:none;
    cursor:pointer;
  }
  .solution-body.hidden-sol::after{
    content:"탭해서 정답·풀이 보기";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--num);
    text-shadow:none;
    font-size:12.5px;
    font-weight:700;
    background:rgba(246,244,238,0.4);
    border-radius:8px;
  }

  /* ===== 결과 모달 ===== */
  .result-modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(32,36,43,0.5);
    z-index:200;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .result-card{
    background:#fff;
    border-radius:14px;
    max-width:420px;
    width:100%;
    max-height:80vh;
    overflow-y:auto;
    padding:24px 22px;
  }
  .result-card h2{ margin:0 0 4px; font-size:20px; }
  .result-time{ font-size:13px; color:var(--num); margin-bottom:14px; }
  #resultSummary p{ font-size:15px; line-height:1.6; margin:0 0 10px; }
  .wrong-check-list{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px 6px;
    margin:10px 0 4px;
    padding:12px;
    background:var(--paper);
    border-radius:8px;
  }
  .wrong-check-list label{ display:flex; align-items:center; gap:5px; font-size:13px; }
  .result-actions{ display:flex; gap:8px; margin-top:16px; }
  .result-actions button{
    font-family:inherit;
    flex:1;
    font-size:14px;
    font-weight:700;
    border-radius:8px;
    padding:10px;
    cursor:pointer;
    border:none;
  }
  .result-actions .btn-retry{ background:var(--accent); color:#fff; }
  .result-actions .btn-close{ background:#eee6d6; color:var(--ink); }
  .result-actions .btn-gen{ background:#33578c; color:#fff; }
  .save-status{ font-size:13px; font-weight:700; margin-top:4px; min-height:18px; }
  .save-status.saving{ color:#8a6d1f; }
  .save-status.ok{ color:var(--accent); }
  .save-status.fail{ color:var(--wrong); }

  /* ===== 유사문제 생성 영역 ===== */
  .gen-section{
    display:none;
    max-width:var(--content-max);
    margin:18px auto 60px;
    padding:0 20px;
  }
  .gen-section-title{
    font-size:15px;
    font-weight:800;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .gen-section-title .tag{
    font-size:11px;
    font-weight:700;
    background:#33578c;
    color:#fff;
    padding:2px 9px;
    border-radius:999px;
  }
  .gen-grid{
    background:var(--sheet);
    border:1px solid var(--rule);
    border-radius:16px;
    box-shadow:0 2px 10px rgba(32,36,43,0.05);
    padding:22px;
    display:grid;
    grid-template-columns:1fr;
  }
  @media (min-width:760px){
    .gen-grid{ grid-template-columns:1fr 1fr; column-gap:32px; padding:32px; }
  }
  .gen-origin{
    font-size:11px;
    font-weight:700;
    color:#33578c;
    background:#e8eef7;
    padding:2px 8px;
    border-radius:5px;
    margin-left:6px;
  }

  footer{
    max-width:var(--content-max);
    margin:0 auto;
    padding:0 20px 50px;
    font-size:12px;
    color:var(--num);
    text-align:center;
  }

  .home-btn{
    position:fixed;
    bottom:18px;
    right:18px;
    z-index:150;
    width:46px;
    height:46px;
    border-radius:50%;
    background:#20242b;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:20px;
    box-shadow:0 3px 10px rgba(32,36,43,0.3);
    border:none;
  }
  .home-btn:hover{ opacity:0.9; }
</style>
</head>
<body>
<a class="home-btn" href="../index.html" title="홈으로">🏠</a>


<div class="quiz-bar" id="quizBar">
  <button class="quiz-btn start" id="startBtn" onclick="startQuiz()">▶ 시작</button>
  <button class="quiz-btn stop" id="endBtn" onclick="endQuiz()" disabled>■ 종료</button>
  <div class="quiz-timer" id="quizTimer">00:00</div>
  <button class="quiz-btn scroll-mode" id="scrollModeBtn" onclick="toggleScrollMode()">✏️ 필기 모드</button>
</div>

<div class="page-nav" id="pageNav">
  <span class="page-nav-label">페이지</span>
</div>

<div class="result-modal" id="resultModal">
  <div class="result-card">
    <h2>채점 결과</h2>
    <div class="result-time" id="resultTime"></div>
    <div id="resultSummary"></div>
    <div class="save-status" id="saveStatus"></div>
    <div class="result-actions">
      <button class="btn-retry" onclick="retrySelectedWrong()">선택한 오답만 다시 풀기</button>
      <button class="btn-gen" onclick="generateSimilarForChecked()">체크한 문제 유사문제 만들기</button>
    </div>
    <div class="result-actions">
      <button class="btn-close" onclick="closeResultModal()">닫기</button>
    </div>
  </div>
</div>

<header>
  <h1 id="setTitle">불러오는 중...</h1>
  <div class="sub" id="setSub"></div>
</header>



<div id="pagesContainer"></div>

<section class="gen-section" id="genSection">
  <div class="gen-section-title"><span class="tag">유사문제</span> 체크했던 오답 문제와 비슷한 문제예요</div>
  <div class="gen-grid" id="genGrid"></div>
</section>

<footer>
  ✏️ 펜으로 직접 풀이를 쓰고, 다 풀면 "정답·풀이 보기"로 확인하세요 · 종료를 누르면 전체 결과가 나와요 (매쓰플랫 기출 유사 문제 제공)
</footer>

<script>
  renderMathInElement(document.body, {
    delimiters: [
      {left: "\\(", right: "\\)", display: false},
      {left: "\\[", right: "\\]", display: true}
    ]
  });

  let TOTAL_PROBLEMS = 0;
  let quizState = { running:false, startTime:0, timerInt:null, answers:{} };
  let scrollModeOn = false;
  let solutionsUnlocked = false;
  let currentProblemsData = [];

  function toggleScrollMode(){
    scrollModeOn = !scrollModeOn;
    const btn = document.getElementById('scrollModeBtn');
    if(btn){
      btn.textContent = scrollModeOn ? '✋ 스크롤 모드' : '✏️ 필기 모드';
      btn.classList.toggle('active', scrollModeOn);
    }
    document.querySelectorAll('.write-canvas').forEach(c => {
      c.style.touchAction = scrollModeOn ? 'pan-y' : 'none';
    });
  }

  // 구글 시트 저장 설정 — Apps Script 배포 후 URL 교체
  const SHEET_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbzqgkELv7cxD3UZlVj1XfvNiFtR4o6nI5uyDOLiMme6hx5eCcaVkNc_cUZ3JawAafKc/exec';

  // v1.4: 손글씨 답 인식 방식 선택.
  // 'ocrspace' — 브라우저에서 OCR.space로 직접 호출 (백엔드/Anthropic 키 불필요, 지금 사용)
  // 'anthropic' — Apps Script 백엔드(action:'ocrAnswer')를 통해 Claude 비전으로 인식
  //               (ANTHROPIC_API_KEY를 스크립트 속성에 등록한 뒤 이 값을 'anthropic'으로 바꾸면 전환됨)
  const OCR_PROVIDER = 'ocrspace';
  const OCR_SPACE_KEY = 'K83219514388957';
  const STUDENT_NAME_KEY = 'complex56_student_name';
  let WORKSHEET_ID = '';

  function pick(btn, isCorrect){
    const group = btn.parentElement.querySelectorAll('.choice-btn');
    group.forEach(b => { b.disabled = true; b.classList.remove('picked'); });
    btn.classList.add('picked');
    const probDiv = btn.closest('.pcard');
    if(probDiv) quizState.answers[probDiv.dataset.num] = isCorrect ? 'correct' : 'wrong';
    if(solutionsUnlocked){
      revealChoiceFeedback(btn, isCorrect, group);
    }
  }

  function revealChoiceFeedback(btn, isCorrect, group){
    if(isCorrect){
      btn.classList.add('picked-correct');
    } else {
      btn.classList.add('picked-wrong');
      group.forEach(b => {

  function parseNum(str){
    str = (str||'').trim();
    if(str === '') return null;
    if(str.includes('/')){
      const parts = str.split('/');
      if(parts.length === 2){
        const a = parseFloat(parts[0]), b = parseFloat(parts[1]);
        if(!isNaN(a) && !isNaN(b) && b !== 0) return a/b;
      }
      return null;
    }
    const v = parseFloat(str.replace(/\s+/g,''));
    return isNaN(v) ? null : v;
  }

  function checkAnswer(btn, correctStr){
    const wrap = btn.closest('.answer-check');
    const input = wrap.querySelector('.ans-input');
    const feedback = wrap.querySelector('.ans-feedback');
    const userVal = input.value.trim();
    if(userVal === ''){
      feedback.textContent = '값을 입력해주세요';
      feedback.className = 'ans-feedback fb-no';
      return;
    }
    const uNum = parseNum(userVal);
    const cNum = parseNum(correctStr);
    let isCorrect;
    if(uNum !== null && cNum !== null){
      isCorrect = Math.abs(uNum - cNum) < 1e-9;
    } else {
      isCorrect = userVal.replace(/\s+/g,'') === correctStr.replace(/\s+/g,'');
    }
    input.dataset.checked = '1';
    input.dataset.correct = isCorrect ? '1' : '0';
    const probDiv = btn.closest('.pcard');
    if(probDiv) quizState.answers[probDiv.dataset.num] = isCorrect ? 'correct' : 'wrong';
    if(solutionsUnlocked){
      revealAnswerFeedback(input, feedback, isCorrect);
    } else {
      feedback.textContent = '입력 완료 (종료 후 채점 확인)';
      feedback.className = 'ans-feedback';
    }
  }

  function revealAnswerFeedback(input, feedback, isCorrect){
    feedback.textContent = isCorrect ? '✓ 정답이에요!' : '✗ 다시 확인해보세요';
    feedback.className = 'ans-feedback ' + (isCorrect ? 'fb-ok' : 'fb-no');
    input.classList.toggle('input-ok', isCorrect);
    input.classList.toggle('input-no', !isCorrect);

  // v1.4: S펜 손글씨 "정답 칸"을 인식해서 답 입력창에 자동으로 채워준다.
  // 자동으로 채점까지 하지 않고, 인식된 값을 입력창에 넣어 학생이 눈으로 확인한 뒤
  // 직접 "확인" 버튼을 눌러 채점하게 한다 — 오인식으로 억울하게 채점되는 걸 막기 위함.
  // OCR_PROVIDER 값에 따라 OCR.space(브라우저 직접 호출) 또는 백엔드 경유 Claude 비전 중 선택.
  async function recognizeHandwrittenAnswer(n){
    const canvas = document.getElementById('canvas-ans' + n);
    const status = document.getElementById('ocr-status-' + n);
    const input = document.getElementById('input-' + n);
    if(!canvas || !input) return;

    if(status) status.textContent = '🔎 인식 중...';

    try {
      const dataUrl = canvas.toDataURL('image/png');
      const text = (OCR_PROVIDER === 'anthropic')
        ? await recognizeViaAnthropicBackend(dataUrl)
        : await recognizeViaOcrSpace(dataUrl);

      if(text){
        input.value = text;
        input.focus();
        if(status) status.textContent = `✏️ "${text}" 로 인식했어요. 맞으면 확인 버튼을 눌러주세요`;
      } else {
        if(status) status.textContent = '⚠️ 글씨를 알아보지 못했어요. 더 또렷하게 써보거나 직접 입력해주세요';
      }
    } catch(err){
      if(status) status.textContent = '⚠️ 인식 실패: ' + (err.message || '알 수 없는 오류');
    }
  }

  // OCR.space로 직접 인식 (백엔드/Anthropic 키 불필요)
  async function recognizeViaOcrSpace(dataUrl){
    const fd = new FormData();
    fd.append('apikey', OCR_SPACE_KEY);
    fd.append('base64Image', dataUrl);
    fd.append('language', 'eng');
    fd.append('OCREngine', '2');
    fd.append('scale', 'true');
    fd.append('isOverlayRequired', 'false');

    let res, data;
    try {
      res = await fetch('https://api.ocr.space/parse/image', { method: 'POST', body: fd });
      data = await res.json();
    } catch(e){
      throw new Error('OCR.space 연결 실패');
    }
    if(data.IsErroredOnProcessing){
      // 엔진2 실패 시 엔진1로 한 번 더 시도
      fd.set('OCREngine', '1');
      res = await fetch('https://api.ocr.space/parse/image', { method: 'POST', body: fd });
      data = await res.json();
      if(data.IsErroredOnProcessing){
        throw new Error((data.ErrorMessage && data.ErrorMessage[0]) || 'OCR 처리 실패');
      }
    }
    const text = data.ParsedResults && data.ParsedResults[0] ? data.ParsedResults[0].ParsedText.trim() : '';
    return text;
  }

  // 백엔드(action:'ocrAnswer')를 통해 Claude 비전으로 인식 — ANTHROPIC_API_KEY 등록 후 사용
  async function recognizeViaAnthropicBackend(dataUrl){
    if(SHEET_WEBHOOK_URL.indexOf('PASTE_YOUR') === 0){
      throw new Error('서버가 연결되어 있지 않아요');
    }
    const res = await fetch(SHEET_WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'ocrAnswer', imageDataUrl: dataUrl })
    });
    const json = await res.json();
    if(json.status === 'ok'){
      return json.recognized ? json.text : '';
    }
    throw new Error(json.message || '알 수 없는 오류');
  }

  // ===== 필기 캔버스 =====
  function setupCanvas(canvas){
    const ctx = canvas.getContext('2d');
    let drawing = false, lastX = 0, lastY = 0;
    canvas.dataset.mode = 'pen';

    function resize(){
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      const prev = document.createElement('canvas');
      prev.width = canvas.width; prev.height = canvas.height;
      if(canvas.width>0) prev.getContext('2d').drawImage(canvas,0,0);
      canvas.width = rect.width * ratio;
      canvas.height = rect.height * ratio;
      ctx.setTransform(ratio,0,0,ratio,0,0);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if(prev.width>0) ctx.drawImage(prev,0,0,prev.width/ratio,prev.height/ratio);
    }
    resize();
    window.addEventListener('resize', resize);

    function pos(e){
      const rect = canvas.getBoundingClientRect();
      return { x: e.clientX-rect.left, y: e.clientY-rect.top };
    }
    function strokeStyleFor(mode){
      if(mode === 'erase'){
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = 20;
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = '#20242b';
        ctx.lineWidth = 2.2;
      }
    }
    canvas.addEventListener('pointerdown', e => {
      if(scrollModeOn) return; // 스크롤 모드일 때는 그리지 않음
      drawing = true;
      canvas.setPointerCapture(e.pointerId);
      const p = pos(e); lastX = p.x; lastY = p.y;
      strokeStyleFor(canvas.dataset.mode);
      ctx.beginPath();
      ctx.arc(p.x, p.y, ctx.lineWidth/2, 0, Math.PI*2);
      ctx.fillStyle = '#20242b';
      ctx.fill();
    });
    canvas.addEventListener('pointermove', e => {
      if(!drawing) return;
      const p = pos(e);
      strokeStyleFor(canvas.dataset.mode);
      ctx.beginPath();
      ctx.moveTo(lastX,lastY);
      ctx.lineTo(p.x,p.y);
      ctx.stroke();
      lastX = p.x; lastY = p.y;
    });
    ['pointerup','pointerleave','pointercancel'].forEach(evt=>{
      canvas.addEventListener(evt, () => { drawing = false; });
    });
  }

  // ============================================================
  // ===== 오답 문제 → 유사문제 자동 생성 엔진 (다항식) =====
  // ============================================================

  const PROBLEM_FAMILY = {};  // 이 문제지는 아직 유형별 유사문제 생성기가 준비되지 않았어요

  function randInt(min, max){ return Math.floor(Math.random()*(max-min+1)) + min; }
  function randNonZero(min, max){ let v; do{ v = randInt(min,max); } while(v===0); return v; }
  function signStr(v){ return v>=0 ? '+' : '-'; }
  function termStr(coef, sym){
    const a = Math.abs(coef);
    if(a===0) return '';
    const num = a===1 ? '' : String(a);
    return `${num}${sym}`;
  }

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  // 정답 문자열 + 오답 생성 함수 배열 → 5지선다 구성
  function buildMC(correctText, distractorFns){
    const seen = new Set([correctText]);
    const opts = [{text:correctText, correct:true}];
    for(const fn of distractorFns){
      if(opts.length>=5) break;
      const t = fn();
      if(t && !seen.has(t)){ seen.add(t); opts.push({text:t, correct:false}); }
    }
    let guard=0;
    while(opts.length<5 && guard<30){
      guard++;
      const t = correctText + ' ';
      if(!seen.has(t)){ seen.add(t); opts.push({text:t+ '​', correct:false}); }
    }
    return shuffle(opts);
  }

  function genSymmetricThreeVar(){
    const x=randInt(-4,4), y=randInt(-4,4), z=randInt(-4,4);
    const s = x+y+z, p = x*y+y*z+z*x;
    const ans = s*s - 2*p;
    return {
      type:'fillin',
      question:`\\(x+y+z=${s},\\ xy+yz+zx=${p}\\)일 때, \\(x^2+y^2+z^2\\)의 값을 구하시오.`,
      answer:String(ans),
      solution:[`\\(x^2+y^2+z^2=(x+y+z)^2-2(xy+yz+zx)\\)`, `\\(=${s*s}-${2*p}=${ans}\\)`]
    };
  }

  function genExpandCube(){
    const mode = randInt(0,1);
    if(mode===0){
      // (p ± qx)^3 형태
      const p=randInt(2,5), q=randInt(2,4);
      const sign = Math.random()<0.5 ? 1 : -1;
      const c0=p**3, c1=3*p*p*q*sign, c2=3*p*q*q, c3=(q**3)*sign;
      const base = `(${p}${sign>0?'+':'-'}${q}x)^3`;

    if(numerator % denom !== 0) return genFactorTheorem();
    const a = numerator/denom;
    return {
      type:'fillin',
      question:`\\(x\\)에 대한 다항식 \\(f(x)=x^3${signStr(c2)}${Math.abs(c2)}x^2+ax-a+3\\)이 \\(x${(-k)>=0?'+':'-'}${Math.abs(k)}\\)를 인수로 가질 때, 상수 \\(a\\)의 값은?`,
      answer:String(a),
      solution:[`\\(f(${k})=0\\)을 이용해 \\(a\\)에 대한 식을 세우고 풀어보세요.`, `정답: \\(a=${a}\\)`]
    };
  }

  function genRemainderSimple(){
    const c2=randInt(-4,4), c1=randInt(-6,6), c0=randInt(-6,6), k=randInt(-4,4);
    const ans = k**3 + c2*k*k + c1*k + c0;
    return {
      type:'fillin',
      question:`다항식 \\(x^3${signStr(c2)}${Math.abs(c2)}x^2${signStr(c1)}${Math.abs(c1)}x${signStr(c0)}${Math.abs(c0)}\\)를 \\(x${(-k)>=0?'+':'-'}${Math.abs(k)}\\)로 나눈 나머지는?`,
      answer:String(ans),
      solution:[`나머지정리: \\(f(${k})\\)를 계산해보세요.`, `정답: \\(${ans}\\)`]
    };
  }

  function genExponentLaws(){
    const e1=randInt(2,4), e2=randInt(2,4);
    const cText = `-x^${e1}y^{${e1+1}}z^2`;
    const qText = `(-x^${e1}y^2z)^${e1}\\div(-x^${e1}yz^2)^{${e1-1}}`;
    const wrong1 = `x^${e1}y^{${e1+1}}z^2`;
    const wrong2 = `-x^{${e1+2}}y^3z^2`;
    const wrong3 = `-\\dfrac{x^${e1}y^{${e1+1}}}{z^2}`;
    const choices = buildMC(cText, [()=>wrong1, ()=>wrong2, ()=>wrong3]);
    return {
      type:'mc',
      question:`\\(${qText}\\)를 간단히 하면? (단, \\(z\\ne0\\))`,
      choices,
      solution:[`지수법칙 \\((a^m)^n=a^{mn}\\)과 나눗셈 규칙을 차례로 적용해보세요.`]
    };
  }

  // 복소수를 "3+4i", "-4i", "5", "-i" 같은 표준 문자열로 표현
  function fmtC(re, im){
    if(im === 0) return `${re}`;
    let s = '';
    if(re !== 0) s += `${re}`;
    if(im !== 0){
      if(s !== '') s += (im > 0 ? '+' : '-');
      else if(im < 0) s += '-';
      const absIm = Math.abs(im);
      s += (absIm === 1 ? 'i' : `${absIm}i`);
    }
    return s || '0';
  }

  

  // 정답 1개 + 오답 4개(약간의 변형)로 5지선다 보기 구성
  function buildChoices(correctRe, correctIm){
    const seen = new Set([fmtC(correctRe,correctIm)]);
    const options = [{re:correctRe, im:correctIm, correct:true}];
    const perturbs = [
      [correctRe+1,correctIm], [correctRe-1,correctIm],
      [correctRe,correctIm+1], [correctRe,correctIm-1],
      [correctRe*-1,correctIm], [correctRe,correctIm*-1],
      [correctIm,correctRe]
    ];
    for(const [re,im] of perturbs){
      if(options.length >= 5) break;
      const key = fmtC(re,im);
      if(!seen.has(key)){ seen.add(key); options.push({re,im,correct:false}); }
    }
    while(options.length < 5){
      const re = correctRe + randInt(-3,3), im = correctIm + randInt(-3,3);
      const key = fmtC(re,im);
      if(!seen.has(key)){ seen.add(key); options.push({re,im,correct:false}); }
    }
    return shuffle(options.slice(0,5));
  }

  function genAddComplex(){
    const a=randInt(-6,6), b=randInt(-6,6), c=randInt(-6,6), d=randInt(-6,6);
    const isAdd = Math.random() < 0.5;
    const re = isAdd ? a+c : a-c;
    const im = isAdd ? b+d : b-d;
    const op = isAdd ? '+' : '-';
    return {
      type:'mc',
      question:`\\((${fmtC(a,b)})${op}(${fmtC(c,d)})\\)를 계산하면? (단, \\(i=\\sqrt{-1}\\))`,
      choices: buildChoices(re,im),
      solution:[`실수부분: \\(${a} ${op} (${c}) = ${re}\\)`, `허수부분: \\(${b} ${op} (${d}) = ${im}\\)`]
    };
  }

  function genMulComplex(){
    const a=randInt(-4,4)||1, b=randInt(-4,4)||1, c=randInt(-4,4)||1, d=randInt(-4,4)||1;
    const re = a*c - b*d;
    const im = a*d + b*c;
    return {
      type:'mc',
      question:`\\((${fmtC(a,b)})(${fmtC(c,d)})\\)를 계산하면? (단, \\(i=\\sqrt{-1}\\))`,
      choices: buildChoices(re,im),
      solution:[`\\((${fmtC(a,b)})(${fmtC(c,d)}) = ${a}\\cdot${c} + ${a}\\cdot${d}i + ${b}i\\cdot${c} + ${b}i\\cdot${d}i\\)`,
                 `\\(= (${a*c} ${b*d>=0?'-':'+'} ${Math.abs(b*d)}) + (${a*d}+${b*c})i = ${fmtC(re,im)}\\)`]
    };
  }

  function genMulByI(){
    const a=randInt(-5,5)||1, b=randInt(-5,5)||1;
    const k = [1,-1,2,-2,3,-3][randInt(0,5)];
    // k*i*(a+bi) = k*a*i + k*b*i^2 = -k*b + k*a*i
    const re = -k*b, im = k*a;
    return {
      type:'mc',
      question:`\\(${k===1?'':k===-1?'-':k}i(${fmtC(a,b)})\\)를 계산하면? (단, \\(i=\\sqrt{-1}\\))`,
      choices: buildChoices(re,im),
      solution:[`\\(${k}i(${fmtC(a,b)}) = ${k}${a}i + ${k}${b}i^2 = ${re} + ${im}i\\)`]
    };
  }

  function genIPower(){
    const n1 = randInt(50,120)*4 + randInt(0,3);
    const n2 = randInt(50,120)*4 + randInt(0,3);
    const vals = {0:[1,0], 1:[0,1], 2:[-1,0], 3:[0,-1]};
    const [re1,im1] = vals[n1%4];
    const [re2,im2] = vals[n2%4];
    const isAdd = Math.random() < 0.5;
    const re = isAdd ? re1+re2 : re1-re2;
    const im = isAdd ? im1+im2 : im1-im2;
    const op = isAdd ? '+' : '-';
    return {
      type:'mc',
      question:`\\(i^{${n1}}${op}i^{${n2}}\\)을 계산하면?`,
      choices: buildChoices(re,im),
      solution:[`\\(${n1}\\)을 4로 나눈 나머지 \\(=${n1%4}\\), \\(${n2}\\)를 4로 나눈 나머지 \\(=${n2%4}\\)`,
                 `\\(i^{${n1}}=${fmtC(re1,im1)},\\ i^{${n2}}=${fmtC(re2,im2)}\\)`,
                 `\\(${fmtC(re1,im1)} ${op} ${fmtC(re2,im2)} = ${fmtC(re,im)}\\)`]
    };
  }

  function genSumPartsDirect(){
    const a = randInt(-8,8), b = randNonZero(-8,8);
    const useSquare = Math.random() < 0.4;
    const ans = useSquare ? a*a+b*b : a+b;
    return {
      type:'fillin',
      question: useSquare
        ? `\\(${fmtC(a,b)}\\)의 실수부분을 \\(a\\), 허수부분을 \\(b\\)라고 할 때, \\(a^2+b^2\\)의 값을 구하시오. (단, \\(i=\\sqrt{-1}\\))`
        : `\\(${fmtC(a,b)}\\)의 실수부분을 \\(a\\), 허수부분을 \\(b\\)라고 할 때, \\(a+b\\)의 값을 구하시오. (단, \\(i=\\sqrt{-1}\\))`,
      answer: String(ans),
      solution:[`\\(a=${a},\\ b=${b}\\)`, useSquare ? `\\(a^2+b^2=${a*a}+${b*b}=${ans}\\)` : `\\(a+b=${ans}\\)`]
    };
  }

  function genSumPartsEquation(){
    const x = randInt(-6,6), y = randInt(-6,6);
    const kMode = randInt(0,1); // 0: x+y, y+1 형태  1: x-2y 형태
    let leftDesc, rightRe, rightIm, ansLabel, ans;
    if(kMode===0){
      rightRe = x+2; rightIm = y-1; // (x+2)+(y-1)i = 우변
      leftDesc = `(x+2)+(y-1)i`;
      ansLabel = 'x+y'; ans = x+y;
    } else {
      const c = x + y, d = x - 2*y;
      leftDesc = `x+y+(x-2y)i`;
      rightRe = c; rightIm = d;
      ansLabel = 'xy'; ans = x*y;
    }
    return {
      type:'fillin',
      question:`등식 \\(${leftDesc}=${fmtC(rightRe,rightIm)}\\)를 만족하는 실수 \\(x, y\\)에 대하여 \\(${ansLabel}\\)의 값을 구하시오. (단, \\(i=\\sqrt{-1}\\))`,
      answer:String(ans),
      solution:[`실수부분과 허수부분을 비교해 \\(x, y\\)를 구한 뒤 ${ansLabel}를 계산해보세요.`, `정답: \\(${ansLabel}=${ans}\\)`]
    };
  }

  function genRatioParts(){
    const a = randNonZero(-8,8), b = randNonZero(-8,8);
    return {
      type:'fillin',
      question:`\\(${fmtC(a,b)}\\)의 실수부분을 \\(a\\), 허수부분을 \\(b\\)라고 할 때, \\(\\dfrac{a}{b}\\)의 값을 구하시오. (단, \\(i=\\sqrt{-1}\\))`,
      answer:`${a}/${b}`,
      solution:[`\\(a=${a},\\ b=${b}\\)`, `\\(\\dfrac{a}{b}=\\dfrac{${a}}{${b}}\\)`]
    };
  }

  function genConjugateNumeric(){
    const a = randInt(-6,6), b = randNonZero(-6,6);
    const ans = a*a + b*b;
    return {
      type:'fillin',
      question:`\\(z=${fmtC(a,b)}\\)이고 \\(z\\)의 켤레복소수가 \\(\\bar z\\)일 때, \\(z\\bar z\\)의 값을 구하시오. (단, \\(i=\\sqrt{-1}\\))`,
      answer:String(ans),
      solution:[`\\(\\bar z=${fmtC(a,-b)}\\)`, `\\(z\\bar z=(${fmtC(a,b)})(${fmtC(a,-b)})=${a}^2+${b}^2=${ans}\\)`]
    };
  }

  function genConjugateExprMC(){
    const a = randInt(-5,5), b = randNonZero(-5,5);
    // z + i*conj(z) = (a+bi) + i(a-bi) = a+bi + ai - bi^2 = (a+b) + (a+b)i  ... 실제 계산
    const re = a + b;
    const im = a + b;
    return {
      type:'mc',
      question:`복소수 \\(z=${fmtC(a,b)}\\)의 켤레복소수가 \\(\\bar z\\)일 때, \\(z+i\\bar z\\)의 값은? (단, \\(i=\\sqrt{-1}\\))`,
      choices: buildChoices(re,im),
      solution:[`\\(\\bar z=${fmtC(a,-b)}\\)`, `\\(z+i\\bar z=(${fmtC(a,b)})+i(${fmtC(a,-b)})=${fmtC(re,im)}\\)`]
    };
  }

  function genFracConjugate(){
    const denomOptions = [[1,1],[1,-1],[2,1],[1,2],[2,-1]];
    const [c,d] = denomOptions[randInt(0,denomOptions.length-1)];
    const k = randInt(1,4); // 분자를 분모의 배수 근처로 만들어 결과를 정수 위주로 유도
    const denomNormSq = c*c+d*d;
    const a = c*k + randInt(-2,2), b = d*k + randInt(-2,2);
    // (a+bi)/(c+di) = (a+bi)(c-di) / (c^2+d^2)
    const numRe = a*c + b*d;
    const numIm = b*c - a*d;
    if(numRe % denomNormSq !== 0 || numIm % denomNormSq !== 0){
      // 정수로 안 떨어지면 분자를 분모의 실제 배수로 재설정해 깔끔하게 만든다
      const mRe = randInt(-4,4), mIm = randInt(-4,4);
      const newA = mRe*c - mIm*d, newB = mRe*d + mIm*c;
      return finishFracConjugate(newA,newB,c,d,mRe,mIm);
    }
    return finishFracConjugate(a,b,c,d, numRe/denomNormSq, numIm/denomNormSq);
  }
  function finishFracConjugate(a,b,c,d,re,im){
    return {
      type:'mc',
      question:`\\(\\dfrac{${fmtC(a,b)}}{${fmtC(c,d)}}\\)를 계산하면? (단, \\(i=\\sqrt{-1}\\))`,
      choices: buildChoices(re,im),
      solution:[`분모의 켤레 \\(${fmtC(c,-d)}\\)를 분자·분모에 곱해 정리해보세요.`, `정답: \\(${fmtC(re,im)}\\)`]
    };
  }

  function genClassify(){
    // 실수/허수/순허수가 섞인 6개의 수를 무작위로 만들고 개수를 묻는다
    const pool = [];
    // 실수 2개
    for(let i=0;i<2;i++) pool.push({re:randNonZero(-9,9), im:0, label:null});
    // 순허수 2개
    for(let i=0;i<2;i++) pool.push({re:0, im:randNonZero(-9,9), label:null});
    // 일반 허수(둘 다 0 아님) 2개
    for(let i=0;i<2;i++) pool.push({re:randNonZero(-9,9), im:randNonZero(-9,9), label:null});
    shuffle(pool);
    const realCount = pool.filter(p=>p.im===0).length;
    const pureCount = pool.filter(p=>p.re===0 && p.im!==0).length;
    const imagCount = pool.filter(p=>p.im!==0).length;
    const askType = ['실수','순허수','허수'][randInt(0,2)];
    const ans = askType==='실수' ? realCount : askType==='순허수' ? pureCount : imagCount;
    const listStr = pool.map(p => fmtC(p.re,p.im)).join(',\\quad ');
    return {
      type:'fillin',
      question:`다음 수 중 ${askType}${askType==='순허수'?'(실수부분이 0인 허수)':''}의 개수는?`,
      extra:`<div class="ref-box">\\(${listStr}\\)</div>`,
      answer:String(ans),
      solution:[`각 수의 실수부분·허수부분을 확인해 실수/순허수/허수를 구분해보세요.`, `${askType}는 <b>${ans}개</b>예요.`]
    };
  }

  function genCondition(){
    const b = randNonZero(-6,6);
    const k = randInt(-3,3), m = randInt(-6,6);
    // 2a + b = m 형태에서 a를 구하도록
    const a = (m - b) / 2;
    if(!Number.isInteger(a)) return genCondition(); // 정수 아니면 다시 생성
    return {
      type:'fillin',
      question:`복소수 \\(a+bi\\ (a,b\\)는 실수\\()\\)가 다음 조건을 만족시킬 때, \\(a+bi\\)의 실수부분을 구하시오.<br><span style="font-size:13px;color:#555;">(가) 허수부분은 ${b}이다. &nbsp; (나) \\(2a+b=${m}\\)</span>`,
      answer:String(a),
      solution:[`\\(b=${b}\\)`, `\\(2a+${b}=${m} \\Rightarrow a=${a}\\)`]
    };
  }

      });

      </div>`;

    wrap.innerHTML = inner;
    return wrap;
  }

  // v1.3: 문제/보기/풀이 텍스트를 innerHTML에 그대로 꽂으면, "0°<x<45°"처럼
  // <, > 가 포함된 LaTeX(부등호·구간 표기 등)를 브라우저가 진짜 HTML 태그로
  // 오인해서 그 뒤 내용을 통째로 삼켜버리는 문제가 있었다(예: 118번 문항).
  // KaTeX auto-render는 렌더링된 DOM의 텍스트 노드를 스캔하는 방식이라,
  // 여기서 HTML 특수문자만 이스케이프해 넣어도 \( \) 안의 LaTeX 표기(<, > 포함)는
  // 그대로 살아남아 정상적으로 수식 렌더링된다.
  function escapeHtml(s){
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // 문제지 JSON은 두 가지 스키마가 섞여 있을 수 있다.
  //  A) 정식 스키마: num / diff(low·mid·midhigh·high·top) / type(mc·fillin) / correct(0-based) / solution(배열)
  //  B) 구 스키마(변환 문제지들): number / difficulty(하·중·중상·상·최상) / type(mcq·short) / answer / explanation(문장)
  // normalizeProblem은 B를 A로 변환해 렌더링 코드가 항상 A만 다루도록 한다.
  const LEGACY_DIFF_MAP = { '하':'low', '중':'mid', '중상':'midhigh', '상':'high', '최상':'top' };

  function normalizeProblem(p){
    const num = (p.num !== undefined) ? p.num : p.number;
    const diff = (p.diff !== undefined) ? p.diff : (LEGACY_DIFF_MAP[p.difficulty] || p.difficulty);
    let type = p.type;
    if(type === 'mcq') type = 'mc';
    else if(type === 'short') type = 'fillin';

    // 스키마 A의 선택지는 이미 "\(10\)" 처럼 LaTeX로 감싸져 있고,
    // 스키마 B의 선택지는 "①-1" 처럼 원문자 접두사가 붙어 있다 — 둘 다 원문자만 벗겨서 통일한다.
    const choices = (p.choices || []).map(c => String(c).replace(/^[①②③④⑤]\s*/, ''));

    let correct = p.correct;
    if(correct === undefined && type === 'mc' && typeof p.answer === 'number'){
      correct = p.answer - 1;
    }

    let solution = p.solution;
    if(!solution && p.explanation){
      solution = [p.explanation];
    }

    return Object.assign({}, p, { num, diff, type, choices, correct, solution });
  }

  function renderProblemCardHTML(p){
    const n = p.num;
    const diffCls = 'diff-' + p.diff;
    const diffLabel = DIFF_LABEL[p.diff] || p.diff;
    let html = `<div class="pcard" data-num="${n}">
      <div class="pcard-head">
        <span class="pnum">${n}</span>
        <span class="diff-badge ${diffCls}">${diffLabel}</span>
      </div>
      <div class="pquestion">${escapeHtml(p.question)}</div>
      ${Array.isArray(p.images) && p.images.length ? `<div class="pimg-wrap">${p.images.map(src => `<img src="${escapeAttr(src)}" alt="문제 ${n} 첨부 이미지">`).join('')}</div>` : ''}
      ${p.extra || ''}
      <div class="write-pad">
        <div class="write-pad-head">
          <span class="wp-label">✏️ 풀이 쓰기</span>
          <div class="wp-tools">
            <button class="wp-mode wp-mode-pen active" id="pen-mode-${n}" onclick="setPenMode('canvas-${n}','pen')">펜</button>
            <button class="wp-mode wp-mode-erase" id="erase-mode-${n}" onclick="setPenMode('canvas-${n}','erase')">지우개</button>
            <button class="wp-clear" onclick="clearCanvas('canvas-${n}')">전체 지우기</button>
          </div>
        </div>
        <canvas class="write-canvas" id="canvas-${n}"></canvas>
      </div>`;

    if(p.type === 'mc'){
      html += '<div class="choices">';
      p.choices.forEach((ch, i) => {
        const isCorrect = (p.correct === i) ? 'true' : 'false';
        html += `<button class="choice-btn" onclick="pick(this,${isCorrect})">${CIRCLE[i]} ${escapeHtml(ch)}</button>`;
      });
      html += '</div>';
    } else {
      html += `<div class="write-pad answer-pad">
        <div class="write-pad-head">
          <span class="wp-label">✍️ S펜으로 정답만 쓰기</span>
          <div class="wp-tools">
            <button class="wp-mode wp-mode-pen active" id="pen-mode-ans${n}" onclick="setPenMode('canvas-ans${n}','pen')">펜</button>
            <button class="wp-mode wp-mode-erase" id="erase-mode-ans${n}" onclick="setPenMode('canvas-ans${n}','erase')">지우개</button>
            <button class="wp-clear" onclick="clearCanvas('canvas-ans${n}')">지우기</button>
          </div>
        </div>
        <canvas class="write-canvas ans-canvas" id="canvas-ans${n}"></canvas>
        <button class="ac-btn ocr-btn" type="button" onclick="recognizeHandwrittenAnswer(${n})">🔍 손글씨 인식해서 입력</button>
        <span class="ocr-status" id="ocr-status-${n}"></span>
      </div>
      <div class="answer-check">
        <span class="ac-label">내 답 입력</span>
        <input type="text" class="ans-input" id="input-${n}" placeholder="답 입력 (또는 위에서 손글씨 인식)">
        <button class="ac-btn" onclick="checkAnswer(this, '${escapeAttr(p.answer)}')">확인</button>
        <span class="ans-feedback" id="feedback-${n}"></span>
      </div>`;
    }

    const solLines = (p.solution || []).map(s => `<div class="sol-line">${escapeHtml(s)}</div>`).join('');
    html += `<div class="solution-wrap">
        <button class="solution-toggle" onclick="toggleSol(this)">정답·풀이 보기</button>
        <div class="solution-body hidden-sol" onclick="toggleSol(this.previousElementSibling)">${solLines}</div>
      </div>
    </div>`;
    return html;
  }

  function buildPagesFromProblems(problems){
    const pages = [];
    for(let i=0; i<problems.length; i+=PAGE_SIZE){
      pages.push(problems.slice(i, i+PAGE_SIZE));
    }
    return pages;
  }

  function renderAllPages(pages){
    const container = document.getElementById('pagesContainer');
    const nav = document.getElementById('pageNav');
    let pagesHtml = '';
    let navHtml = '<span class="page-nav-label">페이지</span>';
    pages.forEach((pg, idx) => {
      const pageNum = idx+1;
      const first = pg[0].num, last = pg[pg.length-1].num;
      const cards = pg.map(renderProblemCardHTML).join('\n');
      pagesHtml += `<section class="page${pageNum===1?' active':''}" id="page-${pageNum}" data-page="${pageNum}">
        <div class="page-title">${first}~${last}번</div>
        <div class="page-grid">${cards}</div>
      </section>`;
      navHtml += `<button class="page-nav-btn${pageNum===1?' active':''}" data-page="${pageNum}" onclick="goToPage(${pageNum})">${pageNum}</button>`;
    });
    container.innerHTML = pagesHtml;
    nav.innerHTML = navHtml;
  }

  async function loadProblemSet(){
    const params = new URLSearchParams(window.location.search);
    const setId = params.get('set');
    let data;

    try{
      if(setId){
        // v1.2: data/ 바로 밑 평평한 구조뿐 아니라 data/senmath32/처럼 하위 폴더에 있는
        // 세트도 찾을 수 있도록, id로 파일명을 직접 조합하는 대신
        // worksheets-manifest.json에서 해당 id의 file 경로를 찾아 그걸로 fetch한다.
        // (compose.html이 이미 쓰고 있는 방식과 통일)
        let filePath = setId + '.json'; // manifest에서 못 찾으면 기존 방식으로 폴백
        try{
          const manifestRes = await fetch('../data/worksheets-manifest.json');
          if(manifestRes.ok){
            const manifest = await manifestRes.json();
            const entry = manifest.sets.find(s => s.id === setId);
            if(entry && entry.file) filePath = entry.file;
          }
        } catch(manifestErr){
          // manifest를 못 읽어도 기존 방식(평평한 구조)으로 계속 시도
        }
        const res = await fetch('../data/' + filePath);
        if(!res.ok) throw new Error(`문제 파일 요청 실패 (status ${res.status}): ../data/${filePath}`);
        data = await res.json();
      } else {
        const stored = sessionStorage.getItem('customProblemSet');
        if(!stored){
          document.getElementById('setTitle').textContent = '문제 세트를 찾을 수 없어요';
          document.getElementById('setSub').textContent = 'URL에 ?set=문제지ID 를 붙이거나, 재구성 화면에서 넘어와주세요.';
          return;
        }
        data = JSON.parse(stored);
      }
    } catch(err){
      document.getElementById('setTitle').textContent = '문제 세트를 불러오지 못했어요';
      document.getElementById('setSub').textContent = String(err);
      return;
    }

    document.title = (data.title || '문제풀이') + ' — 학생용';
    document.getElementById('setTitle').textContent = data.title || '문제풀이';
    const pageCount = Math.ceil(data.problems.length / PAGE_SIZE);
    document.getElementById('setSub').textContent =
      (data.unit ? data.unit + ' · ' : '') + `전체 ${data.problems.length}문제 · ${pageCount}페이지(한 페이지당 ${PAGE_SIZE}문항) · 시작을 누르고 풀어보세요`;

    // 구 스키마(number/difficulty/mcq·short/answer/explanation)로 만들어진 문제지도
    // 정식 스키마로 변환해 동일하게 렌더링되도록 한다.
    data.problems = data.problems.map(normalizeProblem);

    // v1.3: 오답 반복 학습을 위한 문제 고유키 부여.
    // 문제지가 재구성(compose.html)되어 새 worksheetId를 갖게 되어도 같은 문제로
    // 인식되도록, 개별 문제에 원본 출처(p.sourceId)가 있으면 그것을 쓰고,
    // 없으면 지금 이 세트의 id를 출처로 삼는다.
    const SOURCE_ID = data.id || setId || 'custom';
    data.problems = data.problems.map(p => Object.assign({}, p, {
      problemId: (p.sourceId || SOURCE_ID) + '#' + p.num
    }));

    // 재구성 화면에서 "유사문제로 시작"을 선택한 문제는 여기서 실제 변형 문제로 교체
    data.problems = data.problems.map(p => {
      if(p.useVariant && p.family && GENERATORS[p.family]){
        const spec = GENERATORS[p.family]();
        return Object.assign({}, p, spec, { num: p.num, diff: p.diff, family: p.family });
      }
      return p;
    });

    currentProblemsData = data.problems;
    TOTAL_PROBLEMS = data.problems.length;
    WORKSHEET_ID = (data.id || setId || 'custom') + '-student';

    const pages = buildPagesFromProblems(data.problems);
    renderAllPages(pages);

    renderMathInElement(document.getElementById('pagesContainer'), {
      delimiters: [
        {left: "\\(", right: "\\)", display: false},
        {left: "\\[", right: "\\]", display: true}
      ]
    });
    document.querySelectorAll('.write-canvas').forEach(setupCanvas);
  }

  loadProblemSet();
</script>
</body>
</html>
